<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Jazz Watch social preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#EEECE1;color:#1F2120;display:grid;grid-template-columns:720px 480px}
.copy{padding:44px 64px 0;position:relative}
h1{font:normal 108px/.98 Georgia,serif;letter-spacing:-3px;margin:0}
h1 em{display:block;color:#CF3338;font-size:122px;font-weight:normal}
.tagline{font:30px/1.35 Arial,sans-serif;margin:28px 0 0}
.brand{position:absolute;left:0;right:0;bottom:0;height:202px;background:#1F2120;color:#EEECE1;padding:39px 30px 0 260px}
.mark{position:absolute;display:block;left:64px;top:-22px;width:160px;height:auto}
.credit{font:21px/1.4 Arial,sans-serif;margin:0}
.credit strong{display:block;font-size:29px;margin-top:2px}
.domain{font:18px/1.4 Arial,sans-serif;margin:23px 0 0}
.photo{width:480px;height:630px;object-fit:cover;object-position:45% center;display:block;background:#1F2120}
</style>
<section class="copy">
  <h1>Jazz<em>Watch</em></h1>
  <p class="tagline">Find free jazz livestreams<br>from clubs, stages, and music schools.</p>
  <div class="brand">
    <img class="mark" src="./social-assets/logo-seal.png" width="160" height="160" alt="Stringfest Analytics seal">
    <p class="credit">A livestream guide by<strong>Stringfest Analytics</strong></p>
    <p class="domain">jazzwatch.stringfestanalytics.com</p>
  </div>
</section>
<img class="photo" src="https://cdn.pixabay.com/photo/2021/09/14/18/25/tenor-saxophone-6624725_1280.jpg" alt="Tenor saxophone photograph by EdgarSax on Pixabay">
</html>
